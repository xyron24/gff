evasion_strategies:
  - "Inject realistic acoustic background noise (e.g. airport lounge, typing, HVAC hum) to mask vocoder phase discrepancies."
  - "Introduce conversational disfluencies ('uhm', pauses, false starts) to mimic human cognitive processing."
mitigation_strategies:
  - "Multi-modal cryptographic token challenge over secure push channel prior to payment clearance."
  - "Phonetic liveness verification using dynamic challenge phrases with non-linear phonetic acoustic resonance analysis."
real_world_precedent: "2024 Hong Kong multinational firm $25M deepfake CFO video/voice conference wire transfer fraud."
