    adversary_action: "Recruits or synthesizes 60 digital wallet accounts across 4 distinct regional P2P rails."
    genai_technique: "LLM-driven synthetic onboarding and identity generation."
  - step_number: 2
    stage_name: "Decoy Flow Injection & Graph Camouflage"
    adversary_action: "Injects hundreds of micro-transactions between mule accounts and benign public merchants."
    genai_technique: "Graph RL optimizing structural entropy to mimic authentic social payment graphs."
  - step_number: 3
    stage_name: "Disjoint Multi-Hop Extraction"
    adversary_action: "Routes $350,000 illicit inflow through 8-hop dynamic DAG paths into offshore liquidity endpoints."
    genai_technique: "Dynamic flow path allocation with time-decayed graph re-weighting."
