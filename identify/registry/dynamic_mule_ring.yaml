id: "ATK-006"
name: "Dynamic Mule Cycle Rings"
category: "graph_mule_orchestration"
channel: "p2p_realtime"
severity: "CRITICAL"
genai_role: "Graph Reinforcement Learning orchestrates a non-stationary topology of money mule accounts, dynamically adding decoy edges and rewiring cycles to minimize graph-centrality and cycle-detection scores."
attack_description: |
  Traditional money mule networks use static circular or tree topologies (Layering -> Integration)
  which are readily detected by graph algorithms (Tarjan's cycle detection, PageRank spikes, Louvain community clustering).
  In this vector, an autonomous Graph RL agent actively senses graph metrics. It continuously provisions ephemeral accounts,
  injects benign cross-transfers (decoy transactions), splits cycles into disjoint paths with delayed consolidation nodes,
  and rotates intermediate nodes every 48 hours to evade temporal graph neural networks and flow-tracing heuristics.
