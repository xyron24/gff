[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mastercard-ai-defense-lab"
version = "1.0.0"
description = "Autonomous Closed-Loop Red-Team / Blue-Team AI Defense Lab for Payment Security"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mastercard Innovation Challenge Team", email = "team@fintechfest.example" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "networkx>=3.2",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
    "xgboost>=2.0.0",
    "onnxruntime>=1.16.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.4.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.12.0",
    "flake8>=6.1.0"
]
gnn = [
    "torch>=2.1.0",
    "torch-geometric>=2.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
asyncio_mode = "auto"
